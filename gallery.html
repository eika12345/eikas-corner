<div class="page">

        <div class="separator"></div>

        <div class="content gallery-content">

            <div class="gallery-grid">

                <figure class="gallery-item" id="velete">
                    <img src="images/veleta.png" alt="pico de veleta">
                    <figcaption>Veleta, Sierra Nevada, 3400m</figcaption>
                </figure>

                <figure class="gallery-item" id="maya">
                    <img src="images/mayamemory.png" alt="memory of maya">
                    <figcaption>Memory of Maya</figcaption>
                </figure>

               <figure class="gallery-item" id="egged">
                    <img src="images/egged.png" alt="Car after being driveby egged">
                    <figcaption>Driveby egged at 3am while I was on my scooter :(</figcaption>
                </figure>

                <figure class="gallery-item" id="mercedes">
                    <img src="images/mercedes.png" alt="mercedes">
                    <figcaption>2006 e320</figcaption>
                </figure>

                <figure class="gallery-item" id="morning-fog">
                    <img src="images/morningfog.png" alt="Morning fog">
                    <figcaption>Morning fog</figcaption>
                </figure>

                <figure class="gallery-item" id="rock-hard-place">
                    <img src="images/rockandahardplace.png" alt="A rock and a hard place">
                    <figcaption>A rock and a hard place</figcaption>
                </figure>

                <figure class="gallery-item" id="cinematic-view">
                    <img src="images/cinematicview.png" alt="cinematic view">
                    <figcaption>cinematic view</figcaption>
                </figure>

                <figure class="gallery-item" id="trickshot">
                    <img src="images/trickshot.png" alt="clutch no scoped someone and had to pose for the polaroid">
                    <figcaption>clutch no scoped someone and had to pose for the polaroid</figcaption>
                </figure>

                <figure class="gallery-item" id="berk">
                    <img src="images/eclipse.png" alt="berk">
                    <figcaption>berk</figcaption>
                </figure>

                <figure class="gallery-item" id="punpun">
                    <img src="images/punpunaiko.png" alt="Punpun and Aiko">
                    <figcaption>Punpun and Aiko (tuff)</figcaption>
                </figure>

                <figure class="gallery-item" id="5am-mountain">
                    <img src="images/5ammountain.png" alt="5am mountain">
                    <figcaption>5am mountain</figcaption>
                </figure>

                <figure class="gallery-item" id="sludge">
                    <img src="images/sludge.png" alt="straight goop">
                    <a href="toby.html" style="color: #afff9f; font-family: w98regular;" ><figcaption>straight goop</figcaption></a>

                <!--<figure class="gallery-item">
                    <img src="images/dagashi.jpeg" alt="gallery photo">
