<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toby's Corner | A Secret Page</title>

    <link rel="stylesheet" href="stylesheet.css">
    <link rel="icon" type="image/png" href="images/favicon.png">

    <script src="components.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/postreq/dist/postreq.min.js"></script>
</head>
<body class="toby-page" style="font-family: w98regular;">

    <div class="logo">
        <a href="home.html">
        <img src="images/tobylogo.png" alt="tobycornerlogo">
        </a>
    </div>

    <div class="separator"></div>

    <div class="page">
            <site-nav-left></site-nav-left>
            <div class="vertical-separator divider-left"></div>

        <div class="main">

            <div class="hero">
                <h1 style="font-family: w98bold;">✦ Toby ✦</h1>
            </div>
            <div class="separator"></div>

            <div class="content toby-content">

                <section class="entry">
                    <h2 class="entry-title" style="font-family: w98bold;">For my best friend</h2>
                    <div class="entry-body">
                        <p>A shrine dedicated to somebody I used to know...</p>
                        <p>just kidding he's alive... <a href="https://www.instagram.com/toby.eberhard/" target="_blank" style="color: #afff9f;">instagram</a></p>
                    </div>
                </section>

                <section class="toby-gallery-section">
                    <div class="toby-gallery">
                        <figure class="gallery-item">
                            <img src="images/snoozer.jpeg" alt="snoozing">
                            <figcaption>snoozing on the job smh</figcaption>
                        </figure>
                        <figure class="gallery-item">
                            <img src="images/probalancer.jpg" alt="pro balancer">
                            <figcaption>pro balancer</figcaption>
                        </figure>
                        <figure class="gallery-item">
                            <img src="images/expidionist.png" alt="expidionist">
                            <figcaption>nz expeditionist</figcaption>
                        </figure>
                        <figure class="gallery-item">
                            <img src="images/tob.png" alt="aurafarm">
                            <figcaption>idk i had to fill out the 4th gallery slot</figcaption>
                        </figure>
                    </div>
                </section>

                <section class="entry" style="padding-top: 50px;">
                    <h2 class="entry-title" style="font-family: w98bold;">Right now</h2>
                    <div class="entry-body">
                        <p>hes probably eating some fishy milk or <a href="gallery.html#sludge" style="color: #afff9f;">straight goop</a></p>
                        <p>Gluttenous and endless belly hes got</p>
                    </div>
                </section>

            </div>

        </div>


        <div class="vertical-separator divider-right"></div>
        <site-nav-right></site-nav-right>
    </div>

    <site-footer></site-footer>


    <script src="sidebars.js"></script>




    <script>
        document.querySelectorAll('.spoiler-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var box = btn.closest('.spoiler');
                box.classList.add('revealed');
                box.querySelector('.spoiler-content').removeAttribute('aria-hidden');
            });
        });
    </script>
</body>
</html>
