<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eikas Corner</title>
    <meta name="description" content="My personal corner of the web.">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Eikas Corner">
    <meta property="og:description" content="My personal corner of the web.">
    <meta property="og:image" content="https://eikascorner.neocities.org/images/eikascornerlogo.png">
    <meta property="og:url" content="https://eikascorner.neocities.org/">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Eikas Corner">
    <meta name="twitter:description" content="My personal corner of the web.">
    <meta name="twitter:image" content="https://eikascorner.neocities.org/images/eikascornerlogo.png">

    <link rel="stylesheet" href="stylesheet.css">
    <link rel="icon" type="image/png" href="images/favicon.png">
</head>
<body class="splash-body">

    <div class="logo">
        <a href="home.html">
        <img src="images/eikascornerlogo.png" alt="eikascornerlogo">
        </a>
    </div>


    <div class="splash-wrap">
        <div class="splash">
            <h1 id="typewriter"><span id="typewriter-text"></span></h1>

            <div id="gate" class="gate">
                <button id="continue-btn" class="continue-btn" type="button">Enter</button>
            </div>
        </div>
    </div>

<script>
    (function () {
        var textEl = document.getElementById('typewriter-text');
        if (!textEl) return;

        var lines = [
            "The webmaster wasn't expecting visitors today...",
            "I suppose I can let you in for a small while.."
        ];

        var typeSpeed = 45;
        var pauseAfterType = 1400;

        var lineIndex = 0;
        var charIndex = 0;

        function typeLine() {
            var current = lines[lineIndex];
            if (charIndex <= current.length) {
                textEl.textContent = current.slice(0, charIndex);
                charIndex++;
                setTimeout(typeLine, typeSpeed);
            } else if (lineIndex < lines.length - 1) {
                setTimeout(function () {
                    lineIndex++;
                    charIndex = 0;
                    typeLine();
                }, pauseAfterType);
            } else {
                var gate = document.getElementById('gate');
                if (gate) gate.classList.add('gate-visible');
            }
        }

        typeLine();

        var continueBtn = document.getElementById('continue-btn');
        if (continueBtn) {
            continueBtn.addEventListener('click', function () {
                window.location.href = 'home.html';
            });
        }
    })();
</script>

</body>
</html>
