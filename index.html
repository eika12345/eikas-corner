<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eikas Corner</title>
    <meta name="description" content="Delusional writings">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Eikas Corner">
    <meta property="og:description" content="Delusional writings">
    <meta property="og:image" content="https://eikascorner.neocities.org/images/eikascornerlogo.png">
    <meta property="og:url" content="https://eikascorner.neocities.org/">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Eikas Corner">
    <meta name="twitter:description" content="Delusional writings">
    <meta name="twitter:image" content="https://eikascorner.neocities.org/images/eikascornerlogo.png">

    <link rel="stylesheet" href="stylesheet.css">
    <link rel="icon" type="image/png" href="images/favicon.png">
</head>
<body class="splash-body">

    <div class="logo">
        <a href="home.html">
        <img src="images/eikascornerlogodithered.png" alt="eikascornerlogo">
        </a>
    </div>

    <div class="page-fade">

        <div class="corner-btns">
            <a id="skip-btn" class="skip-btn" href="home.html">Skip</a>
            <button id="bg-btn" class="bg-btn" type="button">Change background</button>
        </div>

        <div class="splash-wrap">
            <div class="splash">
                <h1 id="typewriter"><span id="typewriter-text"></span></h1>

                <div id="gate" class="gate">
                    <button id="continue-btn" class="continue-btn" type="button">Enter</button>
                </div>
            </div>
        </div>

    </div>

<script>
    (function () {
        var textEl = document.getElementById('typewriter-text');
        if (!textEl) return;
 
        var lines = [
            "The websmaster wasn't expecting visitors today..",
            "I suppose I can let you in for a small while.."
        ];
 
        var typeSpeed = 45;
        var pauseAfterType = 1400;
 
        var lineIndex = 0;
        var charIndex = 0;
 
        function typeLine() {
            var current = lines[lineIndex];
            if (charIndex <= current.length) {
                textEl.textContent = current.slice(0, charIndex);
                charIndex++;
                setTimeout(typeLine, typeSpeed);
            } else if (lineIndex < lines.length - 1) {
                setTimeout(function () {
                    lineIndex++;
                    charIndex = 0;
                    typeLine();
                }, pauseAfterType);
            } else {
                var gate = document.getElementById('gate');
                if (gate) gate.classList.add('gate-visible');
            }
        }
 
        window.addEventListener('load', function () {
            typeLine();
        });
 
        var continueBtn = document.getElementById('continue-btn');
        if (continueBtn) {
            continueBtn.addEventListener('click', function () {
                var pageFade = document.querySelector('.page-fade');
                if (pageFade) pageFade.classList.add('fade-out');
                sessionStorage.setItem('fadeTransition', '1');
                setTimeout(function () {
                    window.location.href = 'home.html';
                }, 400);
            });
        }
    })();

    (function () {
    var backgrounds = [
        "images/dreamcorebg.png",
        "images/stuffsbg.png",
        
    ];

    var btn = document.getElementById('bg-btn');
    if (!btn) return;

    var index = 0;
    try {
        var saved = parseInt(localStorage.getItem('splashBg'), 10);
        if (saved >= 0 && saved < backgrounds.length) index = saved;
    } catch (e) {}

    function apply() {
        document.body.style.setProperty('--splash-bg', "url('" + backgrounds[index] + "')");
        try { localStorage.setItem('splashBg', index); } catch (e) {}
    }

    apply();

    btn.addEventListener('click', function () {
        index = (index + 1) % backgrounds.length;
        apply();
    });
})();

(function () {
    var skipBtn = document.getElementById('skip-btn');
    if (!skipBtn) return;

    skipBtn.addEventListener('click', function (e) {
        e.preventDefault();
        var pageFade = document.querySelector('.page-fade');
        if (pageFade) pageFade.classList.add('fade-out');
        try { sessionStorage.setItem('fadeTransition', '1'); } catch (err) {}
        setTimeout(function () {
            window.location.href = 'home.html';
        }, 400);
    });
})();
</script>


</body>
</html>
